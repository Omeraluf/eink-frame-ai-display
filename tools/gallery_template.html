<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Style Gallery</title>
<style>
  :root { --bg: #f4f2ee; --fg: #1d1b18; --muted: #6b665e; --card: #ffffff; --line: #ddd8cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #191816; --fg: #ece8e1; --muted: #9c968c; --card: #24221f; --line: #3a3732; }
  }
  :root[data-theme="dark"] { --bg: #191816; --fg: #ece8e1; --muted: #9c968c; --card: #24221f; --line: #3a3732; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.01em; }
  header p { margin: 0 0 32px; color: var(--muted); }
  section { margin-bottom: 40px; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 14px; display: flex; gap: 10px; align-items: baseline; }
  h2 span { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; min-width: 1.6em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .tile { width: 100%; aspect-ratio: 480 / 800; display: block; background: #fff;
          border: 10px solid var(--card); border-radius: 6px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
          image-rendering: pixelated; }
  .missing { display: grid; place-items: center; color: #8a8a8a; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Art style gallery</h1>
    <p>Each tile is exactly what the 1-bit e-paper frame would show, with today's date and weather ({{DATE}}). Tell me the numbers you like and dislike.</p>
  </header>
  {{ROWS}}
</main>
</body>
</html>
