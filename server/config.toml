# Server settings for building the daily frame

timezone = "Asia/Jerusalem"
orientation = "portrait"   # "portrait" (frame stood upright) or "landscape"
output_dir = "out"         # frame.bin + preview.png land here, relative to the repo root

[background]
# Placeholder until the AI art step: a local photo (gitignored), or blank if missing
path = "images/20261016_124051.jpg"

[weather]
location = "Ramat Gan"
latitude = 32.0823
longitude = 34.8106

# Text placement: x/y are fractions of the canvas, (0, 0) top-left, (1, 1) bottom-right.
# anchor is a Pillow text anchor ("rs" = right edge, baseline). halo is a white
# outline width so the text reads on any background.
[text]
font = "server/fonts/PermanentMarker-Regular.ttf"
halo = 4

[text.date]
format = "%d/%m"           # DD/MM
size = 64
x = 0.92
y = 0.95
anchor = "rs"

[text.weather]
format = "{high:.0f}° / {low:.0f}°  {description}"
size = 32
x = 0.92
y = 0.85
anchor = "rs"
