# Server settings for building the daily frame

timezone = "Asia/Jerusalem"
orientation = "portrait"   # "portrait" (frame stood upright) or "landscape"
output_dir = "out"         # frame.bin, preview.png and art.png land here, relative to the repo root

[weather]
location = "Ramat Gan"
latitude = 32.0823
longitude = 34.8106

[art]
providers = ["cloudflare", "pollinations"]  # tried in order
trim = 0.04                # fraction cut off every edge (models add borders and signatures)
style = "rotate"           # one of `styles` below, or "rotate" for a different one each day
favorite = "Detailed graphite pencil sketch"  # when rotating, shown every `favorite_every` days
favorite_every = 2
styles = [
  "Black and white woodcut illustration, bold carved lines",
  "Black and white linocut illustration, strong simple shapes",
  "Black ink pen illustration with fine cross-hatching",
  "Japanese sumi-e ink wash painting, minimal brush strokes",
  "Victorian engraving illustration, fine line work",
  "Black and white comic book line art, clean inks",
  "Minimalist single-line black ink drawing on white paper",
  "Art nouveau illustration in black and white, flowing ornamental lines",
  "Detailed graphite pencil sketch",
  "Black paper-cut silhouette art on white",
  "Stippling ink illustration made of tiny dots",
  "Ukiyo-e woodblock illustration in black and white",
]
scenes = [
  "a quiet street café with a cat on a chair",
  "a lighthouse on a rocky coast",
  "a small mountain village with winding paths",
  "a city rooftop garden overlooking towers",
  "an old bookshop on a narrow street",
  "a fisherman's boat at a wooden pier",
  "a hilltop olive grove with an old stone house",
  "a busy fruit market stall",
  "a bicycle leaning against a garden fence",
  "a forest cabin by a lake",
]
# Leave room for the date and weather: the text goes into this empty area
carrier = "tall vertical composition with plenty of open space in the upper part of the sky"
requirements = "full-bleed edge to edge, pure black and white, high contrast"

[art.cloudflare]
model = "@cf/black-forest-labs/flux-1-schnell"  # free daily allowance on Workers AI
steps = 8                  # 1-8, more is better quality
retries = 3

[art.pollinations]
retries = 6                # free tier allows 1 image per 45 s, so retries wait that long
watermark_crop = 40        # extra pixels requested and cut off the bottom (Pollinations logo)

[calendar]
mode = "important"         # "important" (one event), "week" (next few events) or "off"
lookahead_days = 7
important_marker = "!"     # put this in an event title to make it the one shown
shown_at = "10:00"         # the board's refresh time: earlier events that day are skipped
max_chars = 30             # longer titles are cut with "…"
max_lines = 5              # week mode

# Text block: weather, date and calendar lines. With placement = "auto" the server
# looks for a blank bright area (e.g. empty sky) and centers the block there;
# otherwise, or if none is found, the block goes in the fallback corner with a white halo.
[text]
placement = "auto"         # "auto" or "fixed"
halo = 4
line_gap = 10
max_width = 0.92          # fraction of the canvas width a line may use; longer ones get "…"

[text.auto]
search_top = 0.0           # search band, as fractions of the height
search_bottom = 0.6
min_brightness = 200       # 0-255: the area must be mostly white...
max_variation = 45         # ...and calm (low standard deviation); the halo covers a few stray lines
padding = 16

[text.fallback]
x = 0.94                   # block's bottom-right corner, as fractions of the canvas
y = 0.97

[text.weather]
format = "{high:.0f}° / {low:.0f}°  {description}"
font = "server/fonts/PermanentMarker-Regular.ttf"
size = 32

[text.date]
format = "%d/%m"           # DD/MM
font = "server/fonts/PermanentMarker-Regular.ttf"
size = 64

[text.calendar]
font = "server/fonts/AmaticSC-Bold.ttf"  # has Hebrew letters
size = 42
max_rows = 2               # an event too wide for one row wraps onto a second
