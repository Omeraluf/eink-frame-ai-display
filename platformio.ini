; TRMNL 7.5" (OG) DIY Kit — minimal Hello World
[env:trmnl_og_diy]
platform  = espressif32@6.12.0
board     = seeed_xiao_esp32s3
framework = arduino
; Seeed_GFX board/panel selection — as build flags so the library sees them too
build_flags =
    -D BOARD_SCREEN_COMBO=502                ; 7.5" monochrome ePaper (UC8179)
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04
lib_deps  =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
upload_port   = /dev/cu.usbmodem1401
monitor_port  = /dev/cu.usbmodem1401
monitor_speed = 115200
